name: Build GreenPrism Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Prepare optional CurseForge API key for release build
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if ($env:CF_API_KEY) {
            python -c "import os; open('local_secrets.py', 'w', encoding='utf-8').write('CF_API_KEY = ' + repr(os.environ['CF_API_KEY'].strip()) + '\n')"
            echo "SECRET_FLAG=--hidden-import=local_secrets" >> $env:GITHUB_ENV
          } else {
            echo "SECRET_FLAG=" >> $env:GITHUB_ENV
          }

      - name: Build Portable .exe (--onefile)
        shell: pwsh
        run: |
          $extra = @()
          if ($env:SECRET_FLAG) { $extra += $env:SECRET_FLAG }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx `
            --icon="icon.ico" `
            --version-file="version_info.txt" `
            --add-data "ui;ui" `
            --hidden-import=certifi --hidden-import=requests --hidden-import=minecraft_launcher_lib --hidden-import=pypresence --hidden-import=crash_rescue `
            --collect-data=certifi --collect-data=webview --collect-data=minecraft_launcher_lib `
            --exclude-module tkinter --exclude-module _tkinter `
            --exclude-module unittest --exclude-module pydoc `
            --exclude-module doctest --exclude-module test `
            --exclude-module PIL --exclude-module numpy --exclude-module matplotlib `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module wx --exclude-module gi --exclude-module gtk `
            @extra `
            --name "GreenPrism_Portable" main.py

      - name: Build --onedir & Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $extra = @()
          if ($env:SECRET_FLAG) { $extra += $env:SECRET_FLAG }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx `
            --icon="icon.ico" `
            --version-file="version_info.txt" `
            --add-data "ui;ui" `
            --hidden-import=certifi --hidden-import=requests --hidden-import=minecraft_launcher_lib --hidden-import=pypresence --hidden-import=crash_rescue `
            --collect-data=certifi --collect-data=webview --collect-data=minecraft_launcher_lib `
            --exclude-module tkinter --exclude-module _tkinter `
            --exclude-module unittest --exclude-module pydoc `
            --exclude-module doctest --exclude-module test `
            --exclude-module PIL --exclude-module numpy --exclude-module matplotlib `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module wx --exclude-module gi --exclude-module gtk `
            @extra `
            --name "GreenPrism" main.py
          if (Test-Path "local_secrets.py") { Remove-Item "local_secrets.py" -Force }

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if ($iscc) {
            & $iscc installer_inno.iss
          }

      - name: Collect release files & compute SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_out" | Out-Null
          Copy-Item "dist\GreenPrism_Portable.exe" "release_out\GreenPrism_Portable.exe" -Force
          Get-ChildItem -Path "dist_installer\*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_out\$($_.Name)" -Force
          }
          $lines = @()
          Get-ChildItem -Path "release_out\*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $lines += "$hash  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii "release_out\SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenPrism-Windows-x64
          path: release_out/*

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_out/*
