name: Build GreenPrism Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Prepare optional CurseForge API key for release build
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if ($env:CF_API_KEY) {
            python -c "import os; open('local_secrets.py', 'w', encoding='utf-8').write('CF_API_KEY = ' + repr(os.environ['CF_API_KEY'].strip()) + '\n')"
            echo "SECRET_FLAG=--hidden-import=local_secrets" >> $env:GITHUB_ENV
          } else {
            echo "SECRET_FLAG=" >> $env:GITHUB_ENV
          }

      - name: Build --onedir executable (clean VirusTotal profile)
        shell: pwsh
        run: |
          $extra = @()
          if ($env:SECRET_FLAG) { $extra += $env:SECRET_FLAG }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx `
            --icon="icon.ico" `
            --version-file="version_info.txt" `
            --add-data "ui;ui" `
            --hidden-import=certifi --hidden-import=requests --hidden-import=minecraft_launcher_lib --hidden-import=pypresence --hidden-import=crash_rescue `
            --collect-data=certifi --collect-data=webview --collect-data=minecraft_launcher_lib `
            --exclude-module tkinter --exclude-module _tkinter `
            --exclude-module unittest --exclude-module pydoc `
            --exclude-module doctest --exclude-module test `
            --exclude-module PIL --exclude-module numpy --exclude-module matplotlib `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 `
            --exclude-module wx --exclude-module gi --exclude-module gtk `
            @extra `
            --name "GreenPrism" main.py
          if (Test-Path "local_secrets.py") { Remove-Item "local_secrets.py" -Force }

      - name: Package portable ZIP & compute SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GreenPrism/*" -DestinationPath "GreenPrism_Windows_x64.zip" -Force
          $hash = (Get-FileHash "GreenPrism_Windows_x64.zip" -Algorithm SHA256).Hash
          "$hash  GreenPrism_Windows_x64.zip" | Out-File -Encoding ascii "SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenPrism-Windows-x64
          path: |
            GreenPrism_Windows_x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GreenPrism_Windows_x64.zip
            SHA256SUMS.txt
